      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --header-bg: #ffffff;
      --header-text: #0f172a;
      --header-sub: #64748b;
      --nav-bg: #ffffff;
      --nav-active-bg: #0f172a;
      --nav-active-text: #fbbf24;
      --hero-bg: #0f172a;
      --hero-tile: #1e293b;
      --hero-border: #334155;
      --card-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-outer: #020617;
        --bg-app: #0b1120;
        --bg-surface: #131c2e;
        --bg-input: #1e293b;
        --bg-tint-emerald: #064e3b;
        --bg-tint-amber: #451a03;
        --bg-tint-sky: #0c4a6e;
        --border-subtle: #1e293b;
        --border-input: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --header-bg: #111827;
        --header-text: #f8fafc;
        --header-sub: #94a3b8;
        --nav-bg: #111827;
        --nav-active-bg: #1e293b;
        --nav-active-text: #fbbf24;
        --hero-bg: #172554;
        --hero-tile: #0f172a;
        --hero-border: #1e3a8a;
        --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-outer);
      color: var(--text-primary);
      -webkit-tap-highlight-color: transparent;
    }

    .android-shell {
      width: 100%;
      max-width: 405px;
      height: 720px;
      aspect-ratio: 9 / 16;
      background: var(--bg-app);
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.38), 0 0 0 8px #1e293b;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 520px) {
      html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-app); }
      .android-shell {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        aspect-ratio: auto;
        border-radius: 0;
        box-shadow: none;
      }
    }
    body.native-android { height: 100%; width: 100%; overflow: hidden; background: var(--bg-app); }
    body.native-android .android-shell {
      position: fixed;
      inset: 0;
      max-width: none;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border-radius: 0;
      box-shadow: none;
    }

    .scroll-area {
      flex: 1 1 0%;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 16px;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    button, input, select { font-family: inherit; outline: none; }
    button { cursor: pointer; border: none; }

    /* Adaptive Header & Bottom Nav */
    header {
      background: var(--header-bg) !important;
      color: var(--header-text) !important;
      border-bottom: 1px solid var(--border-subtle);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    header .text-slate-400 { color: var(--header-sub) !important; }
    nav {
      background: var(--nav-bg) !important;
      border-top: 1px solid var(--border-subtle) !important;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      flex-shrink: 0;
      padding-bottom: max(10px, env(safe-area-inset-bottom)) !important;
      z-index: 30;
    }
    .nav-btn {
      background: transparent;
      color: var(--text-muted) !important;
      border-radius: 16px !important;
    }
    .nav-btn.active {
      background: var(--nav-active-bg) !important;
      color: var(--nav-active-text) !important;
    }

    /* Rounded Material 3 Cards & Inputs (Light/Dark Adaptive) */
    .bg-white {
      background-color: var(--bg-surface) !important;
      border-color: var(--border-subtle) !important;
      box-shadow: var(--card-shadow) !important;
    }
    .rounded-2xl { border-radius: 22px !important; }
    .rounded-xl { border-radius: 16px !important; }
    .rounded-lg { border-radius: 13px !important; }
    .rounded-full { border-radius: 9999px !important; }

    .bg-slate-900 { background-color: var(--hero-bg) !important; }
    .bg-slate-800 { background-color: var(--hero-tile) !important; }
    .border-slate-800 { border-color: var(--hero-border) !important; }

    select, input {
      background-color: var(--bg-input) !important;
      color: var(--text-primary) !important;
      border: 1px solid var(--border-input) !important;
      border-radius: 14px !important;
    }
    select.bg-emerald-50\/40 { background-color: var(--bg-tint-emerald) !important; border-color: #10b981 !important; }
    select.bg-amber-50\/40 { background-color: var(--bg-tint-amber) !important; border-color: #f59e0b !important; }
    select.bg-sky-50\/40 { background-color: var(--bg-tint-sky) !important; border-color: #38bdf8 !important; }
    .bg-sky-50 { background-color: var(--bg-tint-sky) !important; border-color: #38bdf8 !important; }
    .bg-slate-50 { background-color: var(--bg-input) !important; }

    .text-slate-900, .text-slate-800 { color: var(--text-primary) !important; }
    .text-slate-600 { color: var(--text-secondary) !important; }
    .text-slate-500 { color: var(--text-muted) !important; }
    .text-sky-700, .text-sky-800 { color: #38bdf8 !important; }
    @media (prefers-color-scheme: light) {
      .text-sky-700 { color: #0369a1 !important; }
      .text-sky-800 { color: #075985 !important; }
    }

    .fixed { position: fixed; }
    .bottom-6 { bottom: 1.5rem; }
    .left-1\/2 { left: 50%; }

    .min-h-screen { min-height: 100vh; }

    function showToast(msg) {

      clearTimeout(window._t);
      window._t = setTimeout(() => t.classList.add('hidden'), 2800);

    function lookupNearestKey(obj, numVal) {
      const keys = Object.keys(obj).map(Number).sort((a,b) => a - b);
      let chosen = keys[0];
      for (const k of keys) if (k <= numVal) chosen = k;
      if (numVal > keys[keys.length - 1]) chosen = keys[keys.length - 1];
      const exactKey = Object.keys(obj).find(k => Number(k) === chosen);
      return { key: chosen, value: obj[exactKey] };
    }

    function getPeSize(phaseMm2, cableList) {
      if (phaseMm2 <= 16) return phaseMm2;
      if (phaseMm2 <= 35) return 16;
      const f = cableList.find(c => c.section_mm2 >= phaseMm2 / 2);
      return f ? f.section_mm2 : Math.ceil(phaseMm2 / 2);
    }

    function calcDc(s) {
      const deltaT = ((s.noct - 20) / 800) * s.gPeak;
      const tCellMax = s.tmax + deltaT;
      const vocCold = s.voc * (1 + (s.bvoc / 100) * (s.tmin - 25));
      const vmpCold = s.vmp * (1 + (s.bvmp / 100) * (s.tmin - 25));
      const vmpHot = s.vmp * (1 + (s.bvmp / 100) * (tCellMax - 25));
      const vocHot = s.voc * (1 + (s.bvoc / 100) * (tCellMax - 25));
      const vLimit = Math.min(s.vmax, s.vsys);
      const nMax = Math.max(1, Math.floor(vLimit / vocCold));
      const nMin = Math.max(1, Math.ceil(s.mpptMin / vmpHot), Math.ceil(s.vstart / vocHot));
      const strVocCold = s.chosenN * vocCold;
      const strVmpCold = s.chosenN * vmpCold;
      const strVmpHot = s.chosenN * vmpHot;
      const strKwp = (s.chosenN * s.pmax) / 1000;
      const totalImp = s.k * s.imp;
      const totalIsc = s.k * s.isc;
      let status = 'ok', statusText = `Hợp lệ (${nMin}–${nMax} tấm) · Đạt IEC 62548`;
      if (strVocCold > vLimit) { status = 'danger'; statusText = `NGUY HIỂM: Voc lạnh (${strVocCold.toFixed(0)}V) > ${vLimit}V`; }
      else if (strVmpHot < s.mpptMin) { status = 'warn'; statusText = `Cảnh báo: Vmp nóng (${strVmpHot.toFixed(0)}V) < MPPT min`; }
      else if (strVmpCold > s.mpptMax) { status = 'warn'; statusText = `Lưu ý: Vmp lạnh (${strVmpCold.toFixed(0)}V) > MPPT max`; }
      return { deltaT, tCellMax, nMin, nMax, strVocCold, strVmpHot, strKwp, totalImp, totalIsc, impOk: totalImp <= s.impptMax, iscOk: totalIsc <= s.iscMax, status, statusText };
    }

    function calcAc(s) {
      const is3P = s.phase === '3P';
      const sinPhi = Math.sqrt(Math.max(0, 1 - s.pf * s.pf));
      const ib = s.mode === 'power'
        ? (is3P ? (s.pKw * 1000) / (Math.sqrt(3) * s.u * s.pf) : (s.pKw * 1000) / (s.u * s.pf))
        : s.iInput;

      const ittFormula = s.mode === 'power'
        ? (is3P
            ? `Itt = P / (√3 × U × cosφ) = ${(s.pKw * 1000).toLocaleString('en-US')} / (1.732 × ${s.u} × ${s.pf.toFixed(2)}) = ${ib.toFixed(1)} A`
            : `Itt = P / (U × cosφ) = ${(s.pKw * 1000).toLocaleString('en-US')} / (${s.u} × ${s.pf.toFixed(2)}) = ${ib.toFixed(1)} A`)
        : `Itt = Iac max (theo Inverter) = ${ib.toFixed(1)} A`;

      const iReq = ib * s.sf;
      const inRating = TABLES.breakers.standard_ratings_a.find(r => r >= iReq);
      const poles = TABLES.breakers.poles_by_wiring[s.wiring] || (is3P ? '4P' : '2P');
      let family = 'MCB', standard = 'IEC 60898-1', icuList = TABLES.breakers.families.MCB.breaking_capacity_icn_ka;
      if (!inRating) { family = 'Vượt 6300A'; standard = 'IEC 60947-2'; icuList = [150]; }
      else if (inRating > 1600 || (inRating >= 630 && s.iscGrid >= 65)) { family = 'ACB'; standard = 'IEC 60947-2 (Cat. B)'; icuList = TABLES.breakers.families.ACB.breaking_capacity_icu_ka; }
      else if (inRating > 63 || s.iscGrid > 15) { family = 'MCCB'; standard = 'IEC 60947-2'; icuList = TABLES.breakers.families.MCCB.breaking_capacity_icu_ka; }
      const icuSel = icuList.find(k => k >= s.iscGrid) || icuList[icuList.length - 1];

      const isD1 = s.method === 'duct_D1';
      const isD2 = s.method === 'buried_D2';
      const isBuried = isD1 || isD2;
      const ktTable = isBuried ? TABLES.derating_factors.ground_temp_kt[s.ins] : TABLES.derating_factors.ambient_air_temp_kt[s.ins];
      const kt = lookupNearestKey(ktTable, s.temp).value;
      const kgTable = isD1
        ? TABLES.derating_factors.grouping_ducts_touching_kg
        : (isD2 ? TABLES.derating_factors.grouping_buried_touching_kg : TABLES.derating_factors.grouping_in_air_kg);
      const kg = lookupNearestKey(kgTable, s.group).value;
      const soilRes = Number(s.soilRes) || 2.5;
      const ks = isD1
        ? lookupNearestKey(TABLES.derating_factors.soil_thermal_resistivity_ks_duct_D1, soilRes).value
        : (isD2 ? lookupNearestKey(TABLES.derating_factors.soil_thermal_resistivity_ks_direct_D2, soilRes).value : 1.0);
      const kTotal = kt * kg * ks;
      const inEff = iReq;
      const cableList = TABLES.cables[`${s.mat}_${s.ins}`];
      const coreKey = is3P ? '3_cores' : '2_cores';
      const validCables = cableList.filter(c => c.ampacity_iz_a[coreKey][s.method] != null);

      const evalCable = (c, nPar) => {
        const izBase = c.ampacity_iz_a[coreKey][s.method];
        const izEffTotal = izBase * kTotal * nPar;
        const xVal = s.struct === 'single_core' ? c.x_single_core_ohm_per_km : c.x_ohm_per_km;
        const factor = is3P ? Math.sqrt(3) : 2;
        const duVolt = factor * ib * (s.len / 1000) * ((c.r_ohm_per_km / nPar) * s.pf + (xVal / nPar) * sinPhi);
        const duPct = (duVolt / s.u) * 100;
        return {
          c, nPar, izBase, izEffTotal, duVolt, duPct,
          peMm2: getPeSize(c.section_mm2, cableList),
          ampOk: izEffTotal >= iReq,
          ampIbOk: izEffTotal >= ib,
          duOk: duPct <= s.duLimit
        };
      };

      let best = null;
      if (s.cableMode === 'manual') {
        const chosenCable = validCables.find(c => c.section_mm2 === Number(s.manualSection)) || validCables[validCables.length - 1];
        const chosenPar = Math.max(1, Math.min(12, parseInt(s.manualNPar, 10) || 1));
        best = evalCable(chosenCable, chosenPar);
      } else {
        for (let nPar = 1; nPar <= 12; nPar++) {
          for (const c of validCables) {
            const ev = evalCable(c, nPar);
            if (ev.ampOk && ev.duOk) { best = ev; break; }
          }
          if (best) break;
        }
        if (!best) {
          const c = validCables[validCables.length - 1];
          const izBase = c.ampacity_iz_a[coreKey][s.method] || 1;
          const nPar = Math.max(1, Math.ceil(iReq / (izBase * kTotal)));
          best = evalCable(c, nPar);
        }
      }

      // Format single-core cable clearly as: 3x2x300mm2 Cu/XLPE (3=số pha, 2=số sợi/pha, 300=tiết diện)
      let cableName = '';
      if (s.struct === 'single_core') {

          const mainPhases = `3x${best.nPar}x${best.c.section_mm2}mm2`;
          const neutralPart = s.wiring === '3P+N+PE' ? ` + 1x${best.nPar}x${best.c.section_mm2}mm2(N)` : '';
          const pePart = ` + ${best.nPar}x${best.peMm2}mm2(PE)`;
          cableName = `${mainPhases}${neutralPart} ${s.mat}/${s.ins}${pePart}`;
        } else {
          cableName = `2x${best.nPar}x${best.c.section_mm2}mm2 ${s.mat}/${s.ins} + ${best.nPar}x${best.peMm2}mm2(PE)`;
        }
      } else {
        const phaseCores = is3P ? (s.wiring === '3P+N+PE' ? '4C' : '3C') : '2C';
        cableName = `${best.nPar > 1 ? best.nPar + 'x' : ''}${phaseCores}x${best.c.section_mm2}mm2 ${s.mat}/${s.ins} + ${best.nPar > 1 ? best.nPar + 'x' : ''}1x${best.peMm2}mm2(PE)`;
      }

      return {
        ib, ittFormula, iReq, inEff, family, poles, inRating, standard, icuSel,
        kt, kg, ks, kTotal, best, cableName, validCables,
        spd: TABLES.breakers.spd_type2[s.phase]

            ${(s.method === 'duct_D1' || s.method === 'buried_D2') ? `

      document.getElementById('cmAuto').onclick = () => { s.cableMode = 'auto'; render(); };
      document.getElementById('cmManual').onclick = () => {

      if (msEl) msEl.onchange = (e) => { s.manualSection = Number(e.target.value); render(); };

      if (mpEl) mpEl.onchange = (e) => { s.manualNPar = Number(e.target.value); render(); };

      document.getElementById('acBrand').onchange = (e) => { s.invBrand = e.target.value; render(); };

        s.invId = e.target.value;
        const inv = phaseInvs.find(x => x.id === s.invId);
        if (inv) {
          s.pKw = inv.rated_power_kw;
          if (inv.ac && inv.ac.max_current_a != null) { s.iInput = inv.ac.max_current_a; s.mode = 'current'; }
          else { s.mode = 'power'; }
          showToast(`Đã nạp ${inv.manufacturer} ${inv.model}`);
        }
        render();
      };

      document.getElementById('acPf').onchange = (e) => { s.pf = Math.min(1, Math.max(0.7, parseFloat(e.target.value) || 1)); render(); };

      document.getElementById('acMat').onchange = (e) => { s.mat = e.target.value; render(); };
      document.getElementById('acIns').onchange = (e) => { s.ins = e.target.value; render(); };
      document.getElementById('acStruct').onchange = (e) => {
        s.struct = e.target.value;
        s.method = s.struct === 'single_core' ? (is3P ? 'tray_F_trefoil' : 'conduit_B1') : (is3P ? 'tray_E' : 'conduit_B2');

      document.getElementById('acMethod').onchange = (e) => { s.method = e.target.value; render(); };
      document.getElementById('acLen').onchange = (e) => { s.len = parseFloat(e.target.value) || s.len; render(); };
      document.getElementById('acDu').onchange = (e) => { s.duLimit = parseFloat(e.target.value) || s.duLimit; render(); };

    function renderLib(root) {
      const panels = getAllPanels();
      const invs = getAllInverters();
      const isPanels = state.libTab === 'panels';

        </button>

        ${state.adding === 'panel' ? `
          <form id="addPanelForm" class="bg-white rounded-2xl p-3.5 border border-sky-200 shadow-sm space-y-2 text-xs">

            <div class="grid grid-cols-2 gap-2">
              <input name="manufacturer" required placeholder="Hãng (VD: LONGi)" class="border rounded-lg px-2 py-1.5" />
              <input name="model" required placeholder="Model *" class="border rounded-lg px-2 py-1.5" />
              <input name="pmax_w" type="number" required placeholder="Pmax (Wp) *" class="border rounded-lg px-2 py-1.5" />
              <input name="noct_c" type="number" value="45" placeholder="NOCT (°C)" class="border rounded-lg px-2 py-1.5" />
              <input name="voc_v" type="number" step="0.01" required placeholder="Voc (V) *" class="border rounded-lg px-2 py-1.5" />
              <input name="vmp_v" type="number" step="0.01" required placeholder="Vmp (V) *" class="border rounded-lg px-2 py-1.5" />
              <input name="imp_a" type="number" step="0.01" required placeholder="Imp (A) *" class="border rounded-lg px-2 py-1.5" />
              <input name="isc_a" type="number" step="0.01" required placeholder="Isc (A) *" class="border rounded-lg px-2 py-1.5" />

            <div class="grid grid-cols-2 gap-2">
              <input name="manufacturer" required placeholder="Hãng (VD: Deye)" class="border rounded-lg px-2 py-1.5" />

      document.getElementById('ltPanels').onclick = () => { state.libTab = 'panels'; state.adding = null; render(); };
      document.getElementById('ltInvs').onclick = () => { state.libTab = 'inverters'; state.adding = null; render(); };
      document.getElementById('btnToggleAdd').onclick = () => {
        state.adding = state.adding ? null : (isPanels ? 'panel' : 'inverter');

      const pForm = document.getElementById('addPanelForm');
      if (pForm) pForm.onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(pForm);

          id: 'custom_p_' + Date.now().toString(36),

          imp_a: Number(fd.get('imp_a')), isc_a: Number(fd.get('isc_a')),
          temp_coeff_voc_pct: Number(fd.get('temp_coeff_voc_pct')),
          temp_coeff_pmax_pct: Number(fd.get('temp_coeff_pmax_pct')),

          id: 'custom_i_' + Date.now().toString(36),
          manufacturer: fd.get('manufacturer').trim(),
          model: fd.get('model').trim(),
          type: fd.get('type'), phase: fd.get('phase'),
          rated_power_kw: kw, max_apparent_power_kva: kw,
          dc: {
            max_voltage_v: Number(fd.get('max_voltage_v')),
            startup_voltage_v: fd.get('phase') === '1P' ? 90 : 180,
            mppt_min_v: Number(fd.get('mppt_min_v')), mppt_max_v: Number(fd.get('mppt_max_v')),
            mppt_count: mpptCnt, max_strings: mpptCnt * 2,
            max_input_current_per_mppt_a: Number(fd.get('max_input_current_per_mppt_a')),
            max_isc_per_mppt_a: Number(fd.get('max_isc_per_mppt_a'))
          },
          ac: { rated_current_a: null, max_current_a: Number(fd.get('max_current_a')) },
          afci: 'Tùy chọn', efficiency: { max_pct: 98.0, euro_pct: 97.5 }, source: 'Người dùng bổ sung'
        };
        customInverters.push(rec);
        localStorage.setItem('solar_iec_custom_inverters_v2', JSON.stringify(customInverters));
        state.adding = null;
        showToast(`Đã thêm biến tần ${rec.model}!`);
        render();
      };
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.onclick = () => {
        state.tab = btn.dataset.tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
        render();
      };
    });

    render();
  </script>
</body>
</html>
